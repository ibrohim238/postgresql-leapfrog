# Configuration of the test servers: the temporary one of "make check"
# (--temp-config) and the cassert image (tests/scripts/run-cassert.sh).  The
# server of compose.yaml and the CI cluster set the same values.
shared_preload_libraries = 'leapfrog'
# Deterministic plans for the regression tests.  The tests also SET
# max_parallel_workers_per_gather = 0 themselves, for "make installcheck"
# against any server.
max_parallel_workers_per_gather = 0
jit = off
# The same output on every machine, whatever its locale and time zone.
extra_float_digits = 0
timezone = 'UTC'
datestyle = 'ISO, MDY'
lc_messages = 'C'
