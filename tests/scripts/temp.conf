# Configuration of the test servers, the one source of these settings: the
# temporary server of "make check" (--temp-config), the clusters of
# tests/scripts/start-cluster.sh (the cassert image, the test image on its
# own, CI), and the runtime image of the Dockerfile, which appends it to
# postgresql.conf.sample (the Compose server).
shared_preload_libraries = 'leapfrog'
# Deterministic plans for the regression tests.  The tests also SET
# max_parallel_workers_per_gather = 0 themselves, for "make installcheck"
# against any server.
max_parallel_workers_per_gather = 0
jit = off
# The same output on every machine, whatever its locale and time zone.
extra_float_digits = 0
timezone = 'UTC'
datestyle = 'ISO, MDY'
lc_messages = 'C'
