name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: "Run the benchmark profile (1M rows)"
        type: boolean
        default: false

jobs:
  build-and-test:
    name: PostgreSQL ${{ matrix.pg }} / ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: [18]
        cc: [gcc, clang]
    env:
      PGVERSION: ${{ matrix.pg }}
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
        with:
          # installcheck-upgrade reads the earlier install scripts from the tags
          fetch-depth: 0

      - name: Install PostgreSQL ${{ matrix.pg }} from PGDG
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-${PGVERSION} postgresql-server-dev-${PGVERSION} \
            libipc-run-perl ${{ matrix.cc }}
          echo "/usr/lib/postgresql/${PGVERSION}/bin" >> "$GITHUB_PATH"

      - name: Build (warnings are errors)
        run: make with_llvm=no WERROR=1 CC=${CC}

      - name: Code style (pgindent)
        if: matrix.cc == 'gcc'
        run: make pgindent

      - name: Install
        run: sudo make with_llvm=no install

      - name: Start a cluster with tests/scripts/temp.conf and run the smoke check
        run: |
          sudo pg_dropcluster --stop ${PGVERSION} main || true
          echo "PGDATA=${RUNNER_TEMP}/pgdata" >> "$GITHUB_ENV"
          echo "PGHOST=/tmp" >> "$GITHUB_ENV"
          echo "PGUSER=runner" >> "$GITHUB_ENV"
          PGDATA=${RUNNER_TEMP}/pgdata PGHOST=/tmp PGUSER=runner bash tests/scripts/start-cluster.sh

      - name: Regression and isolation tests (make installcheck)
        run: make installcheck

      - name: Update from the earlier releases (make installcheck-upgrade)
        if: matrix.cc == 'gcc'
        run: make installcheck-upgrade

      - name: Benchmark harness smoke test
        if: matrix.cc == 'gcc'
        run: make bench-smoke

      - name: Show diffs on failure
        if: failure()
        run: |
          cat tests/regress/regression.diffs 2>/dev/null || true
          cat tests/isolation/regression.diffs 2>/dev/null || true
          tail -100 "${PGDATA}/server.log" || true

  checks:
    name: Lint, test lists, version numbers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PGVERSION: 18
      LINT_STRICT: "1"
      ACTIONLINT: 1.7.12
    steps:
      - uses: actions/checkout@v4
        with:
          # check-version compares with the release tags
          fetch-depth: 0
      - name: Install the tools and the server headers (for clang-tidy)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-server-dev-${PGVERSION} shellcheck yamllint codespell clang-tidy
          echo "/usr/lib/postgresql/${PGVERSION}/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          sudo install -m 755 actionlint /usr/local/bin/actionlint && rm actionlint
      - name: make lint
        run: make lint
      - name: make check-tests
        run: make check-tests
      - name: make check-version
        run: make check-version

  docker:
    name: Docker compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build images, start the server, run the suites in a container
        run: bash tests/run-in-docker.sh
      - name: Show diffs on failure
        if: failure()
        run: |
          cat tests/regress/regression.diffs 2>/dev/null || true
          cat tests/isolation/regression.diffs 2>/dev/null || true

  cassert:
    name: PostgreSQL ${{ matrix.pg }} with --enable-cassert
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - name: Build PostgreSQL from source with assertions and the extension
        run: docker build --build-arg PG_BRANCH=REL_${{ matrix.pg }}_STABLE -f docker/cassert.Dockerfile -t leapfrog-cassert .
      - name: Regression and isolation tests, assertion failures in the log
        run: docker run --rm leapfrog-cassert

  bench:
    name: Benchmark (manual, 1M rows, checks the harness only)
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run the benchmark profile
        env:
          SIZE: "1000000"
          REPEATS: "3"
        run: |
          docker compose up -d --build --wait postgres
          docker compose --profile bench run --rm --build bench
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tests/performance/results/
