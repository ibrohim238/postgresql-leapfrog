# docker compose up -d --build --wait (profiles test, bench); see docs/docker.md.

name: leapfrog

services:
  postgres:
    build:
      context: .
      target: runtime
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
    image: leapfrog:${LEAPFROG_TAG:-${PG_MAJOR:-18}}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leapfrog}
      POSTGRES_DB: leapfrog
    command:
      - postgres
      - -c
      - shared_preload_libraries=leapfrog
      # the rest of tests/scripts/temp.conf is in postgresql.conf.sample
      - -c
      - shared_buffers=${LEAPFROG_SHARED_BUFFERS:-512MB}
    ports:
      - "${LEAPFROG_BIND:-127.0.0.1}:${LEAPFROG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # an older pgdata volume lacks the test settings: docker compose down -v
      test: ["CMD-SHELL", "pg_isready -U postgres -d leapfrog && psql -U postgres -d leapfrog -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'leapfrog'\" | grep -q 1 && psql -U postgres -d leapfrog -tAc 'SHOW lc_messages' | grep -qx C"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  test:
    build:
      context: .
      target: test
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
        UID: ${LEAPFROG_UID:-1000}
        GID: ${LEAPFROG_GID:-1000}
    image: leapfrog-test:${LEAPFROG_TAG:-${PG_MAJOR:-18}}
    profiles: [test]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-leapfrog}
      PGDATABASE: leapfrog
    volumes:
      - .:/src/leapfrog

  bench:
    build:
      context: .
      target: test
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
        UID: ${LEAPFROG_UID:-1000}
        GID: ${LEAPFROG_GID:-1000}
    image: leapfrog-test:${LEAPFROG_TAG:-${PG_MAJOR:-18}}
    profiles: [bench]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-leapfrog}
      PGDATABASE: leapfrog
      SIZE: ${SIZE:-20000000}
      REPEATS: ${REPEATS:-3}
    entrypoint: ["bash", "tests/performance/list_bench.sh"]
    volumes:
      - .:/src/leapfrog

volumes:
  pgdata:
