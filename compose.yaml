# docker compose up -d --build --wait      PostgreSQL 18 with leapfrog preloaded
# docker compose run --rm test             regression + isolation tests
# docker compose --profile bench run --rm bench   benchmarks (see tests/performance)
#
# The benchmarks run in a database of their own, leapfrog_bench, never in
# PGDATABASE; tests/run-in-docker.sh runs in a Compose project unique to the
# run and leaves this one and its volume alone.
#
# The test and bench containers mount this repository at /src/leapfrog and
# run as a user with the ids LEAPFROG_UID:LEAPFROG_GID (default 1000:1000;
# tests/run-in-docker.sh and "make docker-build" pass those of the user
# running them), so that the files they write here are that user's.
#
# Environment: PG_MAJOR (default 18) is the PostgreSQL major version of the
# images, LEAPFROG_TAG (default PG_MAJOR) their tag; LEAPFROG_PORT (default
# 5433) is the host port of the server, published on LEAPFROG_BIND (default
# 127.0.0.1, this machine only: the password is well known; 0.0.0.0 for
# every interface); POSTGRES_PASSWORD defaults to "leapfrog".

name: leapfrog

services:
  postgres:
    build:
      context: .
      target: runtime
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
    image: leapfrog:${LEAPFROG_TAG:-${PG_MAJOR:-18}}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leapfrog}
      POSTGRES_DB: leapfrog
    command:
      - postgres
      - -c
      - shared_preload_libraries=leapfrog
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
      # as tests/scripts/temp.conf, the configuration of "make check"
      - -c
      - extra_float_digits=0
      - -c
      - timezone=UTC
      - -c
      - datestyle=ISO, MDY
      - -c
      - lc_messages=C
      - -c
      - shared_buffers=${LEAPFROG_SHARED_BUFFERS:-512MB}
    ports:
      - "${LEAPFROG_BIND:-127.0.0.1}:${LEAPFROG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leapfrog && psql -U postgres -d leapfrog -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'leapfrog'\" | grep -q 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  test:
    build:
      context: .
      target: test
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
        UID: ${LEAPFROG_UID:-1000}
        GID: ${LEAPFROG_GID:-1000}
    image: leapfrog-test:${LEAPFROG_TAG:-${PG_MAJOR:-18}}
    profiles: [test]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-leapfrog}
      PGDATABASE: leapfrog
    volumes:
      - .:/src/leapfrog

  bench:
    build:
      context: .
      target: test
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
        UID: ${LEAPFROG_UID:-1000}
        GID: ${LEAPFROG_GID:-1000}
    image: leapfrog-test:${LEAPFROG_TAG:-${PG_MAJOR:-18}}
    profiles: [bench]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-leapfrog}
      PGDATABASE: leapfrog
      SIZE: ${SIZE:-20000000}
      REPEATS: ${REPEATS:-3}
    entrypoint: ["bash", "tests/performance/list_bench.sh"]
    volumes:
      - .:/src/leapfrog

volumes:
  pgdata:
